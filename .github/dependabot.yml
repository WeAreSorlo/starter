version: 2
updates:
  # The root's lockfile covers both workspaces
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release waits a week before Dependabot offers it, except Sorlo's, which the starter follows as they come out
    cooldown:
      default-days: 7
      exclude: ['@sorlo/*']
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet
      - dependency-name: typescript
        versions: ['>=7']
      # Node's types stay on the Node the CMS's image runs
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Sorlo's packages come together, whatever the update. The npm group leaves them out, since Dependabot puts a
      # dependency in the most specific group it matches, and counts one limited to some kinds of update as that
      sorlo:
        patterns: ['@sorlo/*']
      npm:
        update-types: [minor, patch]
        exclude-patterns: ['@sorlo/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
