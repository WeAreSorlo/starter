version: 2
updates:
  # The root's lockfile covers both workspaces
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release waits a week before Dependabot offers it, except Sorlo's, which the starter follows as they come out
    cooldown:
      default-days: 7
      exclude: ['@sorlo/*']
    groups:
      # A dependency goes in the first group it matches, so Sorlo's packages come together, whatever the update
      sorlo:
        patterns: ['@sorlo/*']
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
